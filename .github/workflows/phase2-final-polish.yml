name: Phase Two Final Polish

on:
  push:
    branches: [phase2/my-book]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/my-book
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/phase2-final-polish.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit validated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html api/wealth.js local-server.mjs lib/advisor-book-source.js lib/wealth-service.js tests/advisor-book.test.mjs tests/wealth.test.mjs
          git commit -m "Polish advisor book data boundaries"
          git push origin HEAD:phase2/my-book
