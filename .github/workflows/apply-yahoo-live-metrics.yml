name: Apply Yahoo live metrics patch

on:
  push:
    branches: [upgrade/yahoo-live-metrics-20260901]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/yahoo-live-metrics-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply targeted client patch
        run: node scripts/apply-yahoo-live-metrics-patch.mjs
      - name: Check patch whitespace
        run: git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Run full build and tests
        run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Expected patch produced no changes"; exit 1; }
          git commit -m "Wire Yahoo live metrics into results"
          git push origin HEAD:upgrade/yahoo-live-metrics-20260901
