name: Apply live global sort fix

on:
  push:
    branches:
      - fix/live-global-sorting-20260902

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply guarded patch
        run: node scripts/apply-live-global-sort-fix.mjs
      - name: Validate full build
        run: npm run build
      - name: Commit validated implementation
        run: |
          rm scripts/apply-live-global-sort-fix.mjs .github/workflows/apply-live-global-sort-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix live global market sorting"
          git push origin HEAD:fix/live-global-sorting-20260902
