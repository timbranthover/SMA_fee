name: Result Column Spacing

on:
  push:
    branches:
      - polish/result-column-spacing

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/result-column-spacing
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tighten metric spacing responsively
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('styles.css')
          css = css_path.read_text()

          replacements = {
              '.results-table th:nth-child(2) { width: 38%; min-width: 270px; }': '.results-table th:nth-child(2) { width: auto; min-width: 270px; }',
              '.results-table th.result-data-column { width: 98px; }': '.results-table th.result-data-column { width: 96px; }',
              '.results-table th.col-primary { width: 236px; }': '.results-table th.col-primary { width: 218px; }',
              '.market-primary-layout { display: flex; align-items: center; gap: 12px; min-width: 0; }': '.market-primary-layout { display: flex; align-items: center; gap: 8px; min-width: 0; }',
          }
          for old, new in replacements.items():
              if css.count(old) != 1:
                  raise SystemExit(f'guard failed for: {old}')
              css = css.replace(old, new)

          marker = '.results-table td { height: 69px; border-bottom: 1px solid var(--line-soft); font-size: 11px; padding: 8px 6px; vertical-align: middle; }'
          addition = marker + '\n.results-table td.result-data-column { padding-left: 4px; padding-right: 4px; }\n.results-table th.result-data-column.sortable-column > button { padding-left: 4px; padding-right: 4px; }'
          if css.count(marker) != 1:
              raise SystemExit('table cell spacing guard failed')
          css = css.replace(marker, addition)
          css_path.write_text(css)

          test_path = Path('tests/static.test.mjs')
          test = test_path.read_text()
          old = '  assert.match(css, /\\.results-table th\\.col-primary \\{ width: 236px; \\}/);'
          new = '''  assert.match(css, /\\.results-table th\\.col-primary \\{ width: 218px; \\}/);\n  assert.match(css, /\\.results-table th:nth-child\\(2\\) \\{ width: auto; min-width: 270px; \\}/);\n  assert.match(css, /\\.results-table th\\.result-data-column \\{ width: 96px; \\}/);\n  assert.match(css, /\\.results-table td\\.result-data-column \\{ padding-left: 4px; padding-right: 4px; \\}/);\n  assert.match(css, /\\.market-primary-layout \\{[^}]*gap: 8px;/);'''
          if test.count(old) != 1:
              raise SystemExit('static test guard failed')
          test_path.write_text(test.replace(old, new))
          PY
      - name: Validate full build
        run: npm run build
      - name: Commit verified spacing polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/result-column-spacing.yml
          git add styles.css tests/static.test.mjs
          git commit -m "Tighten responsive result column spacing"
          git push origin HEAD:polish/result-column-spacing
