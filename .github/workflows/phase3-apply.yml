name: Phase Three Apply

on:
  push:
    branches: [phase3/decision-action]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/decision-action
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded Phase Three integration
        run: python scripts/phase3-apply.py
      - run: npm ci
      - name: Run full build
        id: build
        shell: bash
        run: |
          set +e
          npm run build > /tmp/phase3-build.log 2>&1
          status=$?
          tail -n 180 /tmp/phase3-build.log
          exit "$status"
      - name: Show focused failure diagnostic
        if: failure()
        shell: bash
        run: |
          echo "--- failing tests ---"
          grep -n -B 18 -A 32 '^not ok' /tmp/phase3-build.log || true
          echo "--- assertions/errors ---"
          grep -n -B 8 -A 16 -E 'AssertionError|ERR_ASSERTION|SyntaxError|ReferenceError|TypeError' /tmp/phase3-build.log || true
      - name: Commit validated integration
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css api/wealth.js local-server.mjs lib/advisor-book-source.js lib/wealth-service.js lib/wealth-data.js scripts/build-static.mjs package.json vercel.json tests/decision.test.mjs
          git commit -m "Build Phase Three decision and action layer"
          git push origin HEAD:phase3/decision-action
