name: Book realism migration

on:
  push:
    branches:
      - data/book-realism

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tune generated book distributions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path}: {old[:80]!r}; found {text.count(old)}")
              path.write_text(text.replace(old, new, 1))

          source = Path('lib/advisor-book-source.js')
          replace_once(source,
          '''  const concentration = seed % 4 === 0;\n  const concentrationOrdinal = Math.floor(seed / 4);\n  const primaryHolding = concentration ? SCREENER_EQUITIES[(concentrationOrdinal * 11 + 3) % SCREENER_EQUITIES.length] : pick(HOLDINGS, seed, 79);''',
          '''  const concentration = seed % 7 === 0;\n  const concentrationOrdinal = Math.floor(seed / 7);\n  const targetWeight = concentrationTarget(riskProfile);\n  const primaryHolding = concentration ? SCREENER_EQUITIES[(concentrationOrdinal * 11 + 3) % SCREENER_EQUITIES.length] : pick(HOLDINGS, seed, 79);''')
          replace_once(source,
          '''  const firstWeight = concentration ? 17 + mixedIndex(seed, 81, 12) : 6 + mixedIndex(seed, 82, 8);''',
          '''  const firstWeight = concentration\n    ? Number((targetWeight + 2.3 + mixedIndex(seed, 81, 93) / 10).toFixed(1))\n    : 6 + mixedIndex(seed, 82, 8);''')
          replace_once(source,
          '''    const eligible = [...taxableAccounts, ...nonLiquidityAccounts.filter((account) => !taxableAccounts.some((taxable) => taxable.id === account.id))].slice(0, 4);\n    const eligibleTotal = eligible.reduce((sum, account) => sum + account.marketValue, 0);''',
          '''    const eligiblePool = [...taxableAccounts, ...nonLiquidityAccounts.filter((account) => !taxableAccounts.some((taxable) => taxable.id === account.id))];\n    const concentrationAccountCount = Math.min(eligiblePool.length, 1 + mixedIndex(seed, 130, 4));\n    const eligible = eligiblePool.slice(0, concentrationAccountCount);\n    const eligibleTotal = eligible.reduce((sum, account) => sum + account.marketValue, 0);''')
          replace_once(source,
          '''    let ratio = 0.58 + mixedIndex(seed + goalIndex, 100, 47) / 100;\n    if ((seed + goalIndex) % 11 === 0) ratio -= 0.18;\n    ratio = clamp(ratio, 0.42, 1.08);''',
          '''    let ratio = 0.82 + mixedIndex(seed + goalIndex, 100, 25) / 100;\n    if ((seed + goalIndex) % 9 === 0) ratio -= 0.22;\n    ratio = clamp(ratio, 0.60, 1.08);''')
          replace_once(source,
          '''  if (concentration) {\n    const concentrationPositions = positions.filter((position) => position.instrumentId === primarySnapshot.instrumentId);\n    const concentrationTitle = [''',
          '''  if (concentration) {\n    const concentrationPositions = positions.filter((position) => position.instrumentId === primarySnapshot.instrumentId);\n    const concentrationExcessPct = primarySnapshot.householdWeightPct - targetWeight;\n    const concentrationPriority = concentrationExcessPct >= 8;\n    const concentrationTitle = [''')
          replace_once(source,
          '''      severity: "Priority",\n      tone: "red",\n      title: concentrationTitle,''',
          '''      severity: concentrationPriority ? "Priority" : "Review",\n      tone: concentrationPriority ? "red" : "amber",\n      decisionEligible: mixedIndex(seed, 131, 100) < (concentrationPriority ? 78 : 48),\n      title: concentrationTitle,''')
          replace_once(source,
          '''      severity: "Opportunity",\n      tone: "green",\n      title: cashTitle,''',
          '''      severity: "Opportunity",\n      tone: "green",\n      decisionEligible: mixedIndex(seed, 132, 100) < 30,\n      title: cashTitle,''')
          replace_once(source,
          '''      severity: "Planning",\n      tone: "amber",\n      title: `${goal.name} needs review`,''',
          '''      severity: "Planning",\n      tone: "amber",\n      decisionEligible: goal.confidencePct < 70 || mixedIndex(seed, 133, 100) < 34,\n      title: `${goal.name} needs review`,''')
          replace_once(source, '''  if (seed % 5 === 0) {''', '''  if (seed % 8 === 0) {''')
          replace_once(source,
          '''      severity: "Upcoming",\n      tone: "amber",\n      title: `${moneyShort(amount)} ${obligation.label}`,''',
          '''      severity: "Upcoming",\n      tone: "amber",\n      decisionEligible: mixedIndex(seed, 134, 100) < 58,\n      title: `${moneyShort(amount)} ${obligation.label}`,''')
          replace_once(source, '''  if (seed % 6 === 0) {''', '''  if (seed % 7 === 0) {''')
          replace_once(source, '''  if (heldAwayAccounts.length && seed % 9 === 0) {''', '''  if (heldAwayAccounts.length && seed % 11 === 0) {''')
          replace_once(source, '''  if (seed % 10 === 3) {''', '''  if (seed % 13 === 3) {''')
          replace_once(source, '''  const targetWeight = concentrationTarget(riskProfile);\n  const concentrationPolicies = concentration ? [{''', '''  const concentrationPolicies = concentration ? [{''')

          decisions = Path('lib/decision-source.js')
          replace_once(decisions,
          '''const DECISION_STATUSES = Object.freeze(["New", "Reviewing", "Plan drafted", "Client discussion", "In progress", "Complete"]);''',
          '''const DECISION_STATUS_WEIGHTS = Object.freeze([\n  "New", "New",\n  "Reviewing", "Reviewing", "Reviewing",\n  "Plan drafted", "Plan drafted",\n  "Client discussion",\n  "In progress", "In progress",\n  "Complete",\n]);''')
          replace_once(decisions,
          '''function decisionStatus(householdId, insightId) {\n  return DECISION_STATUSES[hash(`${householdId}:${insightId}:decision-stage`) % DECISION_STATUSES.length];\n}''',
          '''function decisionStatus(householdId, insightId) {\n  return DECISION_STATUS_WEIGHTS[hash(`${householdId}:${insightId}:decision-stage`) % DECISION_STATUS_WEIGHTS.length];\n}''')
          replace_once(decisions,
          '''  const classification = classifyInsight(dataset, household, insight);\n  if (!classification) return null;\n  const status = decisionStatus(household.id, insight.id);''',
          '''  const classification = classifyInsight(dataset, household, insight);\n  if (!classification || insight.decisionEligible === false) return null;\n  const status = decisionStatus(household.id, insight.id);''')

          advisor_tests = Path('tests/advisor-book.test.mjs')
          replace_once(advisor_tests,
          '''  assert.ok(new Set(generatedInsights.map((insight) => insight.title)).size >= 90);''',
          '''  assert.ok(new Set(generatedInsights.map((insight) => insight.title)).size >= 70);''')
          replace_once(advisor_tests,
          '''  assert.ok(new Set(concentrationSymbols).size >= 24, "concentration alerts should span a broad security set");''',
          '''  assert.ok(new Set(concentrationSymbols).size >= 14, "concentration alerts should span a broad security set");''')
          replace_once(advisor_tests,
          '''    assert.ok(matchingPositions.length >= 1 && matchingPositions.length <= 4, `${policy.householdId} concentration should sit in one to four accounts`);\n    assert.equal(new Set(matchingPositions.map((position) => position.accountId)).size, matchingPositions.length);\n  }\n\n  const upcoming = generatedInsights.filter((insight) => insight.severity === "Upcoming");\n  assert.ok(upcoming.length >= 20);\n  assert.ok(new Set(upcoming.map((insight) => insight.title)).size >= 15);''',
          '''    assert.ok(matchingPositions.length >= 1 && matchingPositions.length <= 4, `${policy.householdId} concentration should sit in one to four accounts`);\n    assert.equal(new Set(matchingPositions.map((position) => position.accountId)).size, matchingPositions.length);\n  }\n  const concentrationAccountCounts = concentrationPolicies.map((policy) => ADVISOR_BOOK_DATASET.positions.filter((position) => position.householdId === policy.householdId && position.instrumentId === policy.instrumentId).length);\n  assert.ok(new Set(concentrationAccountCounts).size >= 3, "concentrated positions should not always span the same number of accounts");\n  const concentrationWeights = concentrationPolicies.map((policy) => ADVISOR_BOOK_DATASET.householdHoldingSnapshots.find((holding) => holding.householdId === policy.householdId && holding.instrumentId === policy.instrumentId)?.householdWeightPct).filter(Number.isFinite);\n  assert.ok(new Set(concentrationWeights.map((weight) => weight.toFixed(1))).size >= 12, "concentration percentages should not look bucketed");\n\n  const upcoming = generatedInsights.filter((insight) => insight.severity === "Upcoming");\n  assert.ok(upcoming.length >= 12 && upcoming.length <= 20);\n  assert.ok(new Set(upcoming.map((insight) => insight.title)).size >= 10);''')
          replace_once(advisor_tests,
          '''  const generatedCalls = ADVISOR_BOOK_DATASET.insights.filter((insight) => insight.severity === "Upcoming" && insight.id !== "capital-call");\n  assert.ok(new Set(generatedCalls.map((insight) => insight.title)).size >= 15);''',
          '''  const generatedCalls = ADVISOR_BOOK_DATASET.insights.filter((insight) => insight.severity === "Upcoming" && insight.id !== "capital-call");\n  assert.ok(new Set(generatedCalls.map((insight) => insight.title)).size >= 10);\n  assert.ok(firstPage.metrics.attentionHouseholds >= 35 && firstPage.metrics.attentionHouseholds <= 75, "attention should be selective across the book");\n  assert.ok(firstPage.focusCounts.priority >= 5 && firstPage.focusCounts.priority <= 20, "priority risk should be material but uncommon");\n  assert.ok(firstPage.focusCounts.goals >= 20 && firstPage.focusCounts.goals <= 60, "planning review should affect a minority of households");\n  assert.ok(firstPage.focusCounts.upcoming >= 10 && firstPage.focusCounts.upcoming <= 24, "upcoming obligations should stay episodic");''')

          decision_tests = Path('tests/decision.test.mjs')
          replace_once(decision_tests,
          '''  assert.ok(ADVISOR_WORKSPACE_DATASET.decisions.length > 100);''',
          '''  assert.ok(ADVISOR_WORKSPACE_DATASET.decisions.length >= 25 && ADVISOR_WORKSPACE_DATASET.decisions.length <= 80);''')
          replace_once(decision_tests,
          '''  const cashHousehold = wealthService.getAdvisorBook(DEFAULT_ADVISOR_ID, { focus: "cash", pageSize: 200 }).items.find((item) => item.id !== "household-morrison");\n  assert.ok(cashHousehold);\n  const cashDecision = decisionService.getHouseholdDecisionSummary(cashHousehold.id).decisions.find((decision) => decision.kind === "liquidity");''',
          '''  const cashHousehold = wealthService.getAdvisorBook(DEFAULT_ADVISOR_ID, { focus: "cash", pageSize: 200 }).items.find((item) => item.id !== "household-morrison" && decisionService.getHouseholdDecisionSummary(item.id).decisions.some((decision) => decision.kind === "liquidity"));\n  assert.ok(cashHousehold);\n  const cashDecision = decisionService.getHouseholdDecisionSummary(cashHousehold.id).decisions.find((decision) => decision.kind === "liquidity");''')
          replace_once(decision_tests,
          '''  const goalHousehold = wealthService.getAdvisorBook(DEFAULT_ADVISOR_ID, { focus: "goals", pageSize: 200 }).items.find((item) => item.id !== "household-morrison");\n  assert.ok(goalHousehold);\n  const goalDecision = decisionService.getHouseholdDecisionSummary(goalHousehold.id).decisions.find((decision) => decision.kind === "goal-funding");''',
          '''  const goalHousehold = wealthService.getAdvisorBook(DEFAULT_ADVISOR_ID, { focus: "goals", pageSize: 200 }).items.find((item) => item.id !== "household-morrison" && decisionService.getHouseholdDecisionSummary(item.id).decisions.some((decision) => decision.kind === "goal-funding"));\n  assert.ok(goalHousehold);\n  const goalDecision = decisionService.getHouseholdDecisionSummary(goalHousehold.id).decisions.find((decision) => decision.kind === "goal-funding");''')
          replace_once(decision_tests,
          '''  assert.ok(book.metrics.openDecisions > 0);\n  assert.ok(book.metrics.plansInProgress > 0);''',
          '''  assert.ok(book.metrics.openDecisions >= 20 && book.metrics.openDecisions <= 70);\n  assert.ok(book.metrics.plansInProgress >= 8 && book.metrics.plansInProgress <= 35);\n  assert.ok(book.focusCounts.decisions < book.metrics.householdCount / 2, "active decisions should involve a minority of the book");''')
          PY
      - run: npm ci
      - run: npm run build
      - name: Print resulting book distribution
        run: |
          node --input-type=module <<'NODE'
          import { ADVISOR_WORKSPACE_DATASET, DEFAULT_ADVISOR_ID } from './lib/decision-source.js';
          import { createWealthRepository } from './lib/wealth-repository.js';
          import { createWealthService } from './lib/wealth-service.js';
          const repository = createWealthRepository(ADVISOR_WORKSPACE_DATASET);
          const service = createWealthService(ADVISOR_WORKSPACE_DATASET, { repository });
          const book = service.getAdvisorBook(DEFAULT_ADVISOR_ID, { pageSize: 200 });
          const concentrations = ADVISOR_WORKSPACE_DATASET.concentrationPolicies.filter((p) => p.householdId !== 'household-morrison');
          const accountCounts = concentrations.map((p) => ADVISOR_WORKSPACE_DATASET.positions.filter((position) => position.householdId === p.householdId && position.instrumentId === p.instrumentId).length);
          console.log(JSON.stringify({ metrics: book.metrics, focusCounts: book.focusCounts, decisions: ADVISOR_WORKSPACE_DATASET.decisions.length, concentrationHouseholds: concentrations.length, concentrationAccountCounts: Object.fromEntries([...new Set(accountCounts)].map((n) => [n, accountCounts.filter((v) => v === n).length])), noActiveDecisionHouseholds: book.items.filter((item) => item.openDecisionCount === 0).length, noAttentionHouseholds: book.items.filter((item) => !item.focus.some((key) => ['priority','goals','upcoming'].includes(key))).length }, null, 2));
          NODE
      - run: git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/advisor-book-source.js lib/decision-source.js tests/advisor-book.test.mjs tests/decision.test.mjs
          git commit -m "Make advisor book attention distribution more realistic"
          git push origin HEAD:data/book-realism
