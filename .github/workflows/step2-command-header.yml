name: Build Step 2 command header

on:
  push:
    branches:
      - feature/step2-command-header-20260902

permissions:
  contents: write

jobs:
  build-command-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply command header redesign
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch target: {label}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one patch target for {label}, found {count}")
              return updated

          # Give the decision detail a structured concentration context so the UI never parses display copy.
          path = Path("lib/decision-service.js")
          service = path.read_text()
          service = replace_once(
              service,
              '    const facts = [];\n    const model = { type: record.scenarioType, defaults: {}, bounds: {}, assumptions: [] };\n',
              '    const facts = [];\n    let decisionContext = null;\n    const model = { type: record.scenarioType, defaults: {}, bounds: {}, assumptions: [] };\n',
              "decision context declaration",
          )
          service = replace_once(
              service,
              '      if (review) {\n        facts.push(\n',
              '      if (review) {\n        decisionContext = {\n          type: "concentration",\n          instrumentId: review.holding.instrumentId || review.holding.id || review.holding.symbol,\n          symbol: review.holding.symbol,\n          name: review.holding.name,\n          currentWeight: review.holding.weight,\n          currentValue: review.holding.value,\n          policyTargetWeight: review.targetWeight,\n          targetRelease: review.targetRelease,\n          existingCash: overview.household.investableCash,\n        };\n        facts.push(\n',
              "concentration decision context",
          )
          service = replace_once(
              service,
              '      evidence: { title: insight?.title || record.summary, detail: insight?.detail || record.evidenceSummary, severity: insight?.severity || record.priority, source: record.source },\n      facts,\n',
              '      evidence: { title: insight?.title || record.summary, detail: insight?.detail || record.evidenceSummary, severity: insight?.severity || record.priority, source: record.source },\n      decisionContext,\n      facts,\n',
              "decision context projection",
          )
          path.write_text(service)

          # Replace the generic Step 2 buttons/dropdown with a full-width, data-grounded command header.
          path = Path("app.js")
          app = path.read_text()
          app = sub_once(
              app,
              r'function scenarioAmountOptions\(scenario, detail\) \{.*?\n\}\n\n(?=function scenarioAmountKey)',
              '',
              "remove preset amount choices",
          )

          command_header = r'''function commandRangeProgress(value, minimum, maximum) {
  const min = Number(minimum);
  const max = Number(maximum);
  const numeric = Number(value);
  if (!Number.isFinite(min) || !Number.isFinite(max) || max <= min || !Number.isFinite(numeric)) return 0;
  return Math.max(0, Math.min(100, ((numeric - min) / (max - min)) * 100));
}

function commandSetRangeProgress(range, value = range?.value) {
  if (!range) return;
  range.style.setProperty("--command-progress", `${commandRangeProgress(value, range.min, range.max)}%`);
}

function parseCommandAmount(value) {
  const numeric = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
  return Number.isFinite(numeric) ? numeric : null;
}

function scenarioCommandAmountMaximum(scenario, detail, amountKey) {
  if (detail?.decision?.kind === "concentration") {
    return Math.max(0, Number(scenario?.economics?.release || 0) - Number(scenario?.economics?.goalFunding || 0));
  }
  const bounded = Number(detail?.model?.bounds?.[amountKey]?.max);
  return Number.isFinite(bounded) ? Math.max(0, bounded) : Math.max(0, Number(scenario?.implementation?.amount || 0));
}

function renderScenarioMandate() {
  const container = el("scenarioMandate");
  const scenario = state.activeDecisionScenario;
  const detail = state.activeDecisionDetail;
  if (!container || !state.householdScenario?.proposalMode || !scenario || !detail) { if (container) container.innerHTML = ""; return; }

  const amountKey = scenarioAmountKey(detail);
  const amountStep = Number(detail.model?.bounds?.[amountKey]?.step) || 5000;
  const amountMaximum = scenarioCommandAmountMaximum(scenario, detail, amountKey);
  const amount = Math.max(0, Math.min(amountMaximum, Number(scenario.implementation?.amount || 0)));
  const amountProgress = commandRangeProgress(amount, 0, amountMaximum);

  if (detail.decision.kind === "concentration") {
    const context = detail.decisionContext || {};
    const symbol = context.symbol || "Position";
    const instrumentName = context.name || symbol;
    const shortName = instrumentName.replace(/\s+(Inc\.?|Corporation|Corp\.?)$/i, "");
    const currentWeight = Number(scenario.before?.concentrationPct ?? context.currentWeight ?? 0);
    const currentValue = Number(scenario.before?.concentrationValue ?? context.currentValue ?? 0);
    const target = Number(scenario.inputs?.targetWeight ?? detail.model?.defaults?.targetWeight ?? 0);
    const policyTarget = Number(context.policyTargetWeight ?? detail.model?.defaults?.targetWeight ?? target);
    const targetMinimum = Number(detail.model?.bounds?.targetWeight?.min ?? 1);
    const targetMaximum = Math.max(targetMinimum, currentWeight || Number(detail.model?.bounds?.targetWeight?.max ?? target));
    const targetStep = Number(detail.model?.bounds?.targetWeight?.step ?? 0.5);
    const targetProgress = commandRangeProgress(target, targetMinimum, targetMaximum);
    const remainingProceeds = Math.max(0, amountMaximum - amount);
    const existingCash = Number(scenario.before?.cash ?? context.existingCash ?? 0);
    const modeledCash = Number(scenario.after?.cash ?? existingCash + remainingProceeds);

    container.innerHTML = `<div class="scenario-command-grid">
      <section class="scenario-command-current" aria-label="Current concentration context">
        <span>${escapeHtml(symbol)} concentration</span>
        <div class="scenario-current-flow"><strong>${decisionPercent(currentWeight)}</strong><i aria-hidden="true">→</i><strong>${decisionPercent(target)}</strong></div>
        <small>${formatWealthCurrency(currentValue)} today</small>
        <em>Household target ${decisionPercent(policyTarget)}</em>
      </section>
      <section class="scenario-command-control">
        <header><span>Target ${escapeHtml(shortName)} position</span><label class="scenario-command-input percent"><input type="number" data-scenario-target min="${targetMinimum}" max="${targetMaximum}" step="${targetStep}" value="${target.toFixed(1)}" aria-label="Target ${escapeHtml(shortName)} position weight"><b>%</b></label></header>
        <input class="scenario-command-range" type="range" data-scenario-target-range min="${targetMinimum}" max="${targetMaximum}" step="${targetStep}" value="${target}" style="--command-progress:${targetProgress}%" aria-label="Target ${escapeHtml(shortName)} position weight slider">
        <footer><span>${decisionPercent(targetMinimum)}</span><em>Household target ${decisionPercent(policyTarget)}</em><span>${decisionPercent(targetMaximum)}</span></footer>
      </section>
      <section class="scenario-command-control scenario-command-amount">
        <header><span>Amount to reinvest</span><label class="scenario-command-input money"><b>$</b><input type="text" inputmode="numeric" autocomplete="off" data-scenario-amount-input data-scenario-amount-key="${escapeHtml(amountKey)}" value="${number.format(amount)}" aria-label="Amount to reinvest"></label></header>
        <input class="scenario-command-range" type="range" data-scenario-amount-range data-scenario-amount-key="${escapeHtml(amountKey)}" min="0" max="${amountMaximum}" step="${amountStep}" value="${amount}" style="--command-progress:${amountProgress}%" aria-label="Amount to reinvest slider">
        <footer><span>$0</span><em>${formatWealthCurrency(amountMaximum)} proceeds available</em><span>${formatWealthCurrency(amountMaximum)}</span></footer>
        <p class="scenario-command-note"><strong>${formatWealthCurrency(remainingProceeds)}</strong> of sale proceeds remains in cash. Existing household cash ${formatWealthCurrency(existingCash)} → modeled cash ${formatWealthCurrency(modeledCash)}.</p>
      </section>
    </div>`;
    return;
  }

  const sourceValue = detail.decision.kind === "liquidity" ? Number(scenario.before?.cash || detail.household?.investableCash || amountMaximum) : amountMaximum;
  container.innerHTML = `<div class="scenario-command-grid generic">
    <section class="scenario-command-current">
      <span>${escapeHtml(detail.decision.title)}</span>
      <strong class="scenario-generic-value">${formatWealthCurrency(sourceValue)}</strong>
      <small>${escapeHtml(detail.evidence?.detail || detail.decision.objective || "Household decision context")}</small>
    </section>
    <section class="scenario-command-control scenario-command-amount">
      <header><span>Amount to invest</span><label class="scenario-command-input money"><b>$</b><input type="text" inputmode="numeric" autocomplete="off" data-scenario-amount-input data-scenario-amount-key="${escapeHtml(amountKey)}" value="${number.format(amount)}" aria-label="Amount to invest"></label></header>
      <input class="scenario-command-range" type="range" data-scenario-amount-range data-scenario-amount-key="${escapeHtml(amountKey)}" min="0" max="${amountMaximum}" step="${amountStep}" value="${amount}" style="--command-progress:${amountProgress}%" aria-label="Amount to invest slider">
      <footer><span>$0</span><em>${formatWealthCurrency(amountMaximum)} available</em><span>${formatWealthCurrency(amountMaximum)}</span></footer>
    </section>
  </div>`;
}

async function refreshEmbeddedMandate'''

          app = sub_once(
              app,
              r'function renderScenarioMandate\(\) \{.*?\n\}\n\nasync function refreshEmbeddedMandate',
              command_header,
              "scenario mandate command header",
          )

          app = replace_once(
              app,
              '  el("scenarioTags").innerHTML = tags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("");\n',
              '  el("scenarioTags").innerHTML = proposalMode ? "" : tags.map((tag) => `<span>${escapeHtml(tag)}</span>`).join("");\n',
              "remove proposal pills",
          )
          app = sub_once(
              app,
              r'  el\("scenarioCapital"\)\.hidden = !proposalMode;\n  if \(proposalMode\) \{\n    el\("scenarioCapitalAmount"\)\.textContent = formatWealthCurrency\(implementationAmount\);\n    el\("scenarioCapitalSource"\)\.textContent = sourceLabel \? `From \$\{sourceLabel\}` : "From proposed change";\n  \}\n',
              '  el("scenarioCapital").hidden = true;\n',
              "remove redundant capital summary",
          )

          input_marker = 'document.addEventListener("input", (event) => {\n  const target = event.target;\n'
          input_insertion = '''document.addEventListener("input", (event) => {
  const target = event.target;
  if (target.matches("[data-scenario-target-range]")) {
    const control = target.closest(".scenario-command-control");
    const input = control?.querySelector("[data-scenario-target]");
    if (input) input.value = Number(target.value).toFixed(1);
    commandSetRangeProgress(target);
    return;
  }
  if (target.matches("[data-scenario-target]")) {
    const control = target.closest(".scenario-command-control");
    const range = control?.querySelector("[data-scenario-target-range]");
    const numeric = Number(target.value);
    if (range && Number.isFinite(numeric)) {
      range.value = Math.max(Number(range.min), Math.min(Number(range.max), numeric));
      commandSetRangeProgress(range);
    }
    return;
  }
  if (target.matches("[data-scenario-amount-range]")) {
    const control = target.closest(".scenario-command-control");
    const input = control?.querySelector("[data-scenario-amount-input]");
    if (input) input.value = number.format(Number(target.value));
    commandSetRangeProgress(target);
    return;
  }
  if (target.matches("[data-scenario-amount-input]")) {
    const control = target.closest(".scenario-command-control");
    const range = control?.querySelector("[data-scenario-amount-range]");
    const numeric = parseCommandAmount(target.value);
    if (range && Number.isFinite(numeric)) {
      range.value = Math.max(Number(range.min), Math.min(Number(range.max), numeric));
      commandSetRangeProgress(range);
    }
    return;
  }
'''
          app = replace_once(app, input_marker, input_insertion, "command input synchronization")

          app = replace_once(
              app,
              '  if (target.matches("[data-scenario-target]")) refreshEmbeddedMandate({ targetWeight: Number(target.value) });\n',
              '''  if (target.matches("[data-scenario-target], [data-scenario-target-range]")) {
    const value = Number(target.value);
    if (Number.isFinite(value)) refreshEmbeddedMandate({ targetWeight: value });
  }
  if (target.matches("[data-scenario-amount-input], [data-scenario-amount-range]")) {
    const value = parseCommandAmount(target.value);
    const key = target.dataset.scenarioAmountKey || scenarioAmountKey(state.activeDecisionDetail);
    if (Number.isFinite(value) && key) refreshEmbeddedMandate({ [key]: value });
  }
''',
              "command change handlers",
          )

          app = replace_once(
              app,
              'document.addEventListener("keydown", (event) => {\n  const target = event.target;\n  if (event.key !== "Enter" || !target.matches("[data-range-number]")) return;\n',
              '''document.addEventListener("keydown", (event) => {
  const target = event.target;
  if (event.key !== "Enter") return;
  if (target.matches("[data-scenario-target], [data-scenario-amount-input]")) {
    event.preventDefault();
    target.blur();
    return;
  }
  if (!target.matches("[data-range-number]")) return;
''',
              "command keyboard handling",
          )
          path.write_text(app)

          # Replace the old bunched proposal ribbon with the full-width command layout.
          path = Path("styles.css")
          css = path.read_text()
          command_css = r'''.scenario-ribbon.proposal-mode { min-height: 178px; grid-template-columns: minmax(0, 1fr) auto 30px; grid-template-rows: auto 1fr; align-items: center; gap: 11px 10px; padding: 13px clamp(24px, 2.5vw, 42px) 16px; border-bottom-color: #cfcfca; background: #f7f7f4; box-shadow: 0 4px 15px rgba(0,0,0,.05); }
.scenario-progress { display: flex; align-items: center; gap: 8px; }
.scenario-ribbon.proposal-mode .scenario-progress { grid-column: 1; grid-row: 1; }
.scenario-progress span { display: flex; align-items: center; gap: 7px; color: #999; font-size: 8.5px; font-weight: 700; white-space: nowrap; }
.scenario-progress span i { width: 22px; height: 22px; display: grid; flex: 0 0 22px; place-items: center; border: 1px solid #cfcfca; border-radius: 50%; background: #fff; font-size: 8px; font-style: normal; }
.scenario-progress span.complete { color: #4c685b; }
.scenario-progress span.complete i { border-color: #89a496; background: #edf5f1; }
.scenario-progress span.active { color: #171717; }
.scenario-progress span.active i { border-color: #171717; background: #171717; color: #fff; }
.scenario-progress b { width: 20px; height: 1px; flex: 0 1 20px; background: #d2d2ce; }
.scenario-main { min-width: 0; display: grid; align-content: center; gap: 6px; }
.scenario-ribbon.proposal-mode .scenario-main { grid-column: 1 / -1; grid-row: 2; grid-template-columns: minmax(205px, .72fr) minmax(0, 3fr); grid-template-rows: auto auto; align-items: center; column-gap: clamp(20px, 2vw, 34px); }
.scenario-ribbon.proposal-mode .scenario-main > span { grid-column: 1; grid-row: 1; align-self: end; color: #777; font-size: 8px; font-weight: 700; letter-spacing: .1em; }
.scenario-ribbon.proposal-mode .scenario-main > strong { grid-column: 1; grid-row: 2; align-self: start; max-width: 255px; font-family: Georgia, serif; font-size: 21px; font-weight: 400; line-height: 1.16; }
.scenario-ribbon.proposal-mode .scenario-tags { display: none; }
.scenario-ribbon.proposal-mode .scenario-capital { display: none !important; }
.scenario-mandate { grid-column: 2; grid-row: 1 / span 2; min-width: 0; margin: 0; }
.scenario-mandate:empty { display: none; }
.scenario-command-grid { min-width: 0; display: grid; grid-template-columns: minmax(135px, .55fr) minmax(220px, 1fr) minmax(300px, 1.28fr); align-items: stretch; gap: clamp(14px, 1.5vw, 24px); }
.scenario-command-grid.generic { grid-template-columns: minmax(220px, .7fr) minmax(380px, 1.55fr); }
.scenario-command-current { min-width: 0; display: grid; align-content: center; gap: 4px; padding-right: clamp(12px, 1.3vw, 22px); border-right: 1px solid #d6d6d1; }
.scenario-command-current > span { overflow: hidden; color: #6f6f6b !important; font-size: 7.5px !important; font-weight: 700; letter-spacing: .1em !important; text-overflow: ellipsis; text-transform: uppercase; white-space: nowrap; }
.scenario-current-flow { display: flex; align-items: center; gap: 8px; }
.scenario-current-flow strong, .scenario-generic-value { font-family: Georgia, serif; font-size: 22px; font-weight: 400; line-height: 1; }
.scenario-current-flow strong:last-child { color: #355f4e; }
.scenario-current-flow i { color: #9b9b96; font-size: 13px; font-style: normal; }
.scenario-command-current small { color: #747470; font-size: 8px; }
.scenario-command-current em { color: #52524f; font-size: 7.5px; font-style: normal; font-weight: 700; }
.scenario-command-control { min-width: 0; display: grid; align-content: center; gap: 7px; }
.scenario-command-control header { min-height: 34px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.scenario-command-control header > span { color: #5d5d59 !important; font-size: 7.5px !important; font-weight: 700; letter-spacing: .08em !important; text-transform: uppercase; }
.scenario-command-input { height: 32px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 3px; flex: none; border: 1px solid #bebeb9; border-radius: 2px; background: #fff; padding: 0 8px; color: #222; font-variant-numeric: tabular-nums; }
.scenario-command-input:focus-within { border-color: #555; box-shadow: 0 0 0 2px rgba(0,0,0,.06); }
.scenario-command-input input { min-width: 0; border: 0; outline: 0; background: transparent; color: #171717; font-size: 10px; font-weight: 700; text-align: right; }
.scenario-command-input.percent input { width: 48px; }
.scenario-command-input.money input { width: 88px; }
.scenario-command-input b { font-size: 9px; font-weight: 700; }
.scenario-command-input input[type="number"]::-webkit-inner-spin-button, .scenario-command-input input[type="number"]::-webkit-outer-spin-button { margin: 0; -webkit-appearance: none; }
.scenario-command-range { --command-progress: 0%; width: 100%; height: 16px; margin: 0; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; }
.scenario-command-range::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(to right, #171717 0 var(--command-progress), #d2d2ce var(--command-progress) 100%); }
.scenario-command-range::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -5.5px; border: 1px solid #8d8d88; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); -webkit-appearance: none; }
.scenario-command-range::-moz-range-track { height: 3px; border: 0; border-radius: 2px; background: #d2d2ce; }
.scenario-command-range::-moz-range-progress { height: 3px; border-radius: 2px; background: #171717; }
.scenario-command-range::-moz-range-thumb { width: 14px; height: 14px; border: 1px solid #8d8d88; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.scenario-command-control footer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; color: #92928e; font-size: 7px; font-variant-numeric: tabular-nums; }
.scenario-command-control footer em { overflow: hidden; color: #60605c; font-size: 7.5px; font-style: normal; font-weight: 700; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
.scenario-command-note { margin: 0; color: #767672; font-size: 7.5px; line-height: 1.35; }
.scenario-command-note strong { color: #222; }
.scenario-ribbon.proposal-mode .scenario-back { grid-column: 2; grid-row: 1; min-height: 32px; border: 1px solid #cfcfca; border-radius: 2px; padding: 6px 10px; background: #fff; font-size: 8px; white-space: nowrap; }
.scenario-ribbon.proposal-mode .scenario-dismiss { grid-column: 3; grid-row: 1; width: 30px; height: 30px; }
'''
          css = sub_once(
              css,
              r'\.scenario-ribbon\.proposal-mode \{.*?\.scenario-ribbon\.proposal-mode \.scenario-dismiss \{[^}]*\}\n',
              command_css,
              "proposal command header styles",
          )
          css = sub_once(
              css,
              r'@media \(max-width: 1320px\) \{\n  \.scenario-ribbon\.proposal-mode \{.*?  \.scenario-ribbon\.proposal-mode \.scenario-main > strong \{ font-size: 20px; \}\n',
              '''@media (max-width: 1320px) {
  .scenario-ribbon.proposal-mode { padding-left: 24px; padding-right: 24px; }
  .scenario-progress { gap: 6px; }
  .scenario-progress span { gap: 5px; font-size: 8px; }
  .scenario-progress b { width: 12px; flex-basis: 12px; }
  .scenario-ribbon.proposal-mode .scenario-main { grid-template-columns: 185px minmax(0, 1fr); column-gap: 18px; }
  .scenario-ribbon.proposal-mode .scenario-main > strong { max-width: 195px; font-size: 19px; }
  .scenario-command-grid { grid-template-columns: 126px minmax(190px, .9fr) minmax(270px, 1.2fr); gap: 14px; }
  .scenario-command-grid.generic { grid-template-columns: 190px minmax(330px, 1.4fr); }
  .scenario-command-current { padding-right: 12px; }
  .scenario-command-input.money input { width: 76px; }
''',
              "responsive command header styles",
          )
          path.write_text(css)

          # Regression coverage for the structured context and the new Step 2 controls.
          path = Path("tests/decision.test.mjs")
          test = path.read_text()
          test = replace_once(
              test,
              '  assert.equal(detail.model.type, "concentration");\n  assert.ok(detail.planTemplate.length >= 5);\n',
              '  assert.equal(detail.model.type, "concentration");\n  assert.equal(detail.decisionContext.type, "concentration");\n  assert.equal(detail.decisionContext.symbol, "AAPL");\n  assert.ok(detail.decisionContext.currentWeight > detail.decisionContext.policyTargetWeight);\n  assert.ok(detail.decisionContext.targetRelease > 0);\n  assert.ok(detail.planTemplate.length >= 5);\n',
              "decision context assertions",
          )
          path.write_text(test)

          path = Path("tests/static.test.mjs")
          test = path.read_text()
          test = replace_once(
              test,
              '  assert.match(app, /data-scenario-amount/);\n  assert.match(app, /data-proposal-allocation/);\n',
              '  assert.match(app, /data-scenario-amount/);\n  assert.match(app, /Amount to reinvest/);\n  assert.match(app, /Household target/);\n  assert.doesNotMatch(app, /scenario-amount-choice/);\n  assert.match(css, /\\.scenario-command-grid/);\n  assert.match(css, /\\.scenario-command-range/);\n  assert.match(app, /data-proposal-allocation/);\n',
              "command header static assertions",
          )
          path.write_text(test)
          PY
      - name: Verify full build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/step2-command-header.yml
          git add app.js styles.css lib/decision-service.js tests/decision.test.mjs tests/static.test.mjs
          git commit -m "Redesign proposal selection command header"
          git push origin HEAD:feature/step2-command-header-20260902
