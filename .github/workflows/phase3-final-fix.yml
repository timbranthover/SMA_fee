name: Phase Three Final Fix

on:
  push:
    branches: [phase3/consolidated]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/consolidated
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {s.count(old)} for {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "lib/decision-service.js",
              "const remainingCashProceeds = Math.max(0, release - redeployAmount);",
              "const remainingCashProceeds = Math.max(0, release - goalFunding - redeployAmount);",
          )
          replace_once(
              "lib/decision-service.js",
              "const deployAmount = clamp(input.deployAmount ?? detail.model.defaults.deployAmount, 0, Math.min(overview.household.investableCash, maxDeploy || overview.household.investableCash));",
              "const deployAmount = clamp(input.deployAmount ?? detail.model.defaults.deployAmount, 0, Math.min(overview.household.investableCash, maxDeploy));",
          )
          replace_once(
              "app.js",
              'const decisions = summary?.decisions || [];',
              'const decisions = (summary?.decisions || []).filter((decision) => decision.status !== "Complete");',
          )
          replace_once(
              "app.js",
              '  decisionRequest += 1;\n  state.decisionScenarioController?.abort();',
              '  decisionRequest += 1;\n  state.decisionController?.abort();\n  state.decisionController = null;\n  state.decisionScenarioController?.abort();',
          )
          replace_once(
              "app.js",
              '  const request = ++decisionRequest;\n  state.lastFocus = document.activeElement;',
              '  const request = ++decisionRequest;\n  state.decisionController?.abort();\n  const controller = new AbortController();\n  state.decisionController = controller;\n  state.lastFocus = document.activeElement;',
          )
          replace_once(
              "app.js",
              '    const detail = await loadDecisionDetail(decisionId, state.currentHouseholdId);\n    if (request !== decisionRequest) return;',
              '    const detail = await loadDecisionDetail(decisionId, state.currentHouseholdId, { signal: controller.signal });\n    if (request !== decisionRequest || controller !== state.decisionController) return;',
          )
          replace_once(
              "tests/decision.test.mjs",
              '  assert.ok(scenario.economics.realizedGain > 0);\n  assert.equal("taxReserve" in scenario.economics, false);',
              '  assert.ok(scenario.economics.realizedGain > 0);\n  assert.equal("taxReserve" in scenario.economics, false);\n  assert.equal(scenario.after.cash, scenario.before.cash + scenario.economics.release - scenario.economics.goalFunding - scenario.economics.redeployAmount);',
          )
          replace_once(
              "tests/decision.test.mjs",
              '  assert.ok(cashScenario.before.cash >= cashScenario.after.cash);\n  assert.ok(cashScenario.implementation.amount >= 0);',
              '  assert.ok(cashScenario.before.cash >= cashScenario.after.cash);\n  assert.ok(cashScenario.implementation.amount >= 0);\n\n  const morrisonCashDecision = decisionService.getHouseholdDecisionSummary("household-morrison").decisions.find((decision) => decision.kind === "liquidity");\n  assert.ok(morrisonCashDecision);\n  const reserveProtected = decisionService.modelDecisionScenario("household-morrison", morrisonCashDecision.id, { reservePct: 15, deployAmount: 740000 });\n  assert.equal(reserveProtected.economics.deployAmount, 0);',
          )
          replace_once(
              "tests/static.test.mjs",
              'const files = ["index.html", "app.js", "lib/catalog.js", "lib/shared-config.js", "lib/brand-logos.js", "lib/column-config.js", "lib/sort-config.js", "lib/range-config.js"];',
              'const files = ["index.html", "app.js", "lib/catalog.js", "lib/shared-config.js", "lib/brand-logos.js", "lib/column-config.js", "lib/sort-config.js", "lib/range-config.js", "lib/decision-data.js"];',
          )
          replace_once(
              "tests/wealth.test.mjs",
              '  assert.match(build, /"wealth-data\\.js"/);\n  assert.doesNotMatch(build, /"wealth-source\\.js"|"advisor-book-source\\.js"|"wealth-repository\\.js"|"wealth-service\\.js"/);',
              '  assert.match(build, /"wealth-data\\.js"/);\n  assert.match(build, /"decision-data\\.js"/);\n  assert.doesNotMatch(build, /"wealth-source\\.js"|"advisor-book-source\\.js"|"decision-source\\.js"|"wealth-repository\\.js"|"wealth-service\\.js"|"decision-service\\.js"/);',
          )
          PY
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js lib/decision-service.js tests/decision.test.mjs tests/static.test.mjs tests/wealth.test.mjs
          git diff --cached --quiet && { echo "No changes"; exit 1; }
          git commit -m "Harden decision scenario accounting"
          git push origin HEAD:phase3/consolidated
