name: Book attention cleanup

on:
  push:
    branches:
      - ui/book-attention-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded UI cleanup
        run: |
          echo '' | base64 -d > /tmp/book-attention-cleanup.py
          python3 /tmp/book-attention-cleanup.py
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit UI cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css tests/static.test.mjs
          git commit -m "Clean up advisor book attention column"
          git push origin HEAD:ui/book-attention-cleanup
