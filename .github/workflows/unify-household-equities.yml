name: Unify household equity source

on:
  push:
    branches:
      - data/unify-household-equities

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch household equity source
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sourcePath = 'lib/advisor-book-source.js';
          let source = fs.readFileSync(sourcePath, 'utf8');

          const oldImport = 'import { MORRISON_WEALTH_DATASET } from "./wealth-source.js";';
          const newImport = 'import { resolveBrandKey } from "./brand-logos.js";\nimport { EQUITY_UNIVERSE } from "./equity-universe.js";\nimport { MORRISON_WEALTH_DATASET } from "./wealth-source.js";';
          if (!source.includes(oldImport)) throw new Error('Expected advisor-book import seam not found');
          source = source.replace(oldImport, newImport);

          const stockBlock = /const SINGLE_STOCKS = \[\n[\s\S]*?\n\];\n\nconst DIVERSIFIERS = \[/;
          if (!stockBlock.test(source)) throw new Error('Expected local single-stock block not found');
          source = source.replace(stockBlock, `const HOUSEHOLD_EQUITY_POOL_LIMIT = 192;\nconst SCREENER_EQUITIES = Object.freeze(\n  EQUITY_UNIVERSE\n    .filter(([symbol, name, exchange]) =>\n      (exchange === "NYSE" || exchange === "NASDAQ") &&\n      /^[A-Z][A-Z0-9.-]{0,5}$/.test(symbol) &&\n      !/\\b(?:ADR|ADS|depositary)\\b/i.test(name)\n    )\n    .slice(0, HOUSEHOLD_EQUITY_POOL_LIMIT)\n    .map(([symbol, name]) => [symbol, name, resolveBrandKey({ symbol, name })]),\n);\n\nconst DIVERSIFIERS = [`);

          if (!source.includes('const HOLDINGS = [...SINGLE_STOCKS, ...DIVERSIFIERS];')) throw new Error('Expected holdings composition not found');
          source = source.replace('const HOLDINGS = [...SINGLE_STOCKS, ...DIVERSIFIERS];', 'const HOLDINGS = [...SCREENER_EQUITIES, ...DIVERSIFIERS];');

          const oldSelection = 'const primaryHolding = concentration ? SINGLE_STOCKS[(concentrationOrdinal * 11 + 3) % SINGLE_STOCKS.length] : pick(HOLDINGS, seed, 79);';
          const newSelection = 'const primaryHolding = concentration ? SCREENER_EQUITIES[(concentrationOrdinal * 11 + 3) % SCREENER_EQUITIES.length] : pick(HOLDINGS, seed, 79);';
          if (!source.includes(oldSelection)) throw new Error('Expected concentration selection not found');
          source = source.replace(oldSelection, newSelection);
          fs.writeFileSync(sourcePath, source);

          const testPath = 'tests/advisor-book.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldTestImport = 'import { ADVISOR_BOOK_DATASET, DEFAULT_ADVISOR_ID } from "../lib/advisor-book-source.js";';
          const newTestImport = `${oldTestImport}\nimport { EQUITY_UNIVERSE } from "../lib/equity-universe.js";`;
          if (!test.includes(oldTestImport)) throw new Error('Expected advisor-book test import not found');
          test = test.replace(oldTestImport, newTestImport);

          const concentrationMarker = '  assert.ok(Math.max(...concentrationFrequency.values()) <= 2, "no one security should dominate generated concentration alerts");';
          if (!test.includes(concentrationMarker)) throw new Error('Expected concentration variety assertion not found');
          test = test.replace(concentrationMarker, `${concentrationMarker}\n  const screenerEquitySymbols = new Set(EQUITY_UNIVERSE.map(([symbol]) => symbol));\n  assert.ok(concentrationSymbols.every((symbol) => screenerEquitySymbols.has(symbol)), "generated concentration equities must come from the Screener equity reference universe");`);
          fs.writeFileSync(testPath, test);
          NODE
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/advisor-book-source.js tests/advisor-book.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Source household equities from Screener reference data"
            git push origin HEAD:data/unify-household-equities
          fi
