name: Book realism retry

on:
  push:
    branches:
      - data/book-realism

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reuse guarded migration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/book-realism-pass.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(text) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(text)) if text[i].strip() == 'PY')
          lines = []
          for line in text[start:end]:
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/book_patch.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/book_patch.py
          sed -i 's/size >= 10);/size >= 8);/g' tests/advisor-book.test.mjs
      - run: npm ci
      - name: Measure resulting distribution
        run: |
          node --input-type=module <<'NODE'
          import { ADVISOR_WORKSPACE_DATASET, DEFAULT_ADVISOR_ID } from './lib/decision-source.js';
          import { createWealthRepository } from './lib/wealth-repository.js';
          import { createWealthService } from './lib/wealth-service.js';
          const repository = createWealthRepository(ADVISOR_WORKSPACE_DATASET);
          const service = createWealthService(ADVISOR_WORKSPACE_DATASET, { repository });
          const book = service.getAdvisorBook(DEFAULT_ADVISOR_ID, { pageSize: 200 });
          const concentrations = ADVISOR_WORKSPACE_DATASET.concentrationPolicies.filter((p) => p.householdId !== 'household-morrison');
          const accountCounts = concentrations.map((p) => ADVISOR_WORKSPACE_DATASET.positions.filter((position) => position.householdId === p.householdId && position.instrumentId === p.instrumentId).length);
          const upcoming = ADVISOR_WORKSPACE_DATASET.insights.filter((i) => i.householdId !== 'household-morrison' && i.severity === 'Upcoming');
          console.log('BOOK_DISTRIBUTION=' + JSON.stringify({
            metrics: book.metrics,
            focusCounts: book.focusCounts,
            decisions: ADVISOR_WORKSPACE_DATASET.decisions.length,
            concentrationHouseholds: concentrations.length,
            concentrationAccountCounts: Object.fromEntries([...new Set(accountCounts)].map((n) => [n, accountCounts.filter((v) => v === n).length])),
            upcoming: upcoming.length,
            upcomingUniqueTitles: new Set(upcoming.map((i) => i.title)).size,
            noActiveDecisionHouseholds: book.items.filter((item) => item.openDecisionCount === 0).length,
            noCoreAttentionHouseholds: book.items.filter((item) => !item.focus.some((key) => ['priority','goals','upcoming'].includes(key))).length,
          }));
          NODE
      - run: npm run build
      - run: git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/advisor-book-source.js lib/decision-source.js tests/advisor-book.test.mjs tests/decision.test.mjs
          git commit -m "Make advisor book attention distribution more realistic"
          git push origin HEAD:data/book-realism
