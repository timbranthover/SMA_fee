name: Align Phase Two Test Contract

on:
  push:
    branches: [phase2/my-book]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/my-book
          fetch-depth: 0
      - name: Update wealth architecture assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/wealth.test.mjs')
          text = path.read_text()
          text = text.replace('assert.match(html, /id="wealthView"/);\n  assert.match(html, /id="investmentView" hidden/);\n  assert.match(html, /data-workspace-view="wealth">Total Wealth/);', 'assert.match(html, /id="bookView"/);\n  assert.match(html, /id="wealthView" hidden/);\n  assert.match(html, /id="investmentView" hidden/);\n  assert.match(html, /data-workspace-view="book">Total Wealth/);\n  assert.match(html, /id="bookSearch"/);\n  assert.match(html, /id="bookBody"/);')
          text = text.replace('assert.match(app, /state\\.workspaceView === "investments" \\? ensureInvestmentWorkspaceLoaded\\(\\) : Promise\\.resolve\\(\\)/);', 'assert.match(app, /function loadBook/);\n  assert.match(app, /function openHousehold/);\n  assert.match(app, /loadAdvisorBook/);\n  assert.match(app, /ensureInvestmentWorkspaceLoaded/);')
          text = text.replace('assert.match(app, /loadWealthHistory\\(\\)/);', 'assert.match(app, /loadWealthHistory\\(householdId\\)/);')
          text = text.replace('assert.match(browserWealth, /loadHouseholdOverview/);', 'assert.match(browserWealth, /loadAdvisorBook/);\n  assert.match(browserWealth, /loadHouseholdOverview/);')
          text = text.replace('assert.match(wealthApi, /PROJECTION_VIEWS/);', 'assert.match(wealthApi, /PROJECTION_VIEWS/);\n  assert.match(wealthApi, /getAdvisorBook/);')
          text = text.replace('assert.ok(vercel.rewrites.some((rule) => rule.source === "/investments" && rule.destination === "/"));', 'assert.ok(vercel.rewrites.some((rule) => rule.source === "/household/:id" && rule.destination === "/"));\n  assert.ok(vercel.rewrites.some((rule) => rule.source === "/investments" && rule.destination === "/"));')
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase2-test-patch.yml
      - name: Commit test contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Protect advisor book and dynamic household flow"
            git push origin HEAD:phase2/my-book
          fi
