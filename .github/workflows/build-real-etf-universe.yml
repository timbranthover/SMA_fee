name: Build real ETF universe
on:
  push:
    branches: [data/real-etf-universe]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/real-etf-universe
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh current ETF identities
        run: node scripts/refresh-etf-universe.mjs
      - name: Wire ETF identity reference into catalog
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = Path('lib/catalog.js')
          text = path.read_text()
          text = replace_once(text,
              'import { EQUITY_REFERENCE_AS_OF, EQUITY_REFERENCE_SOURCE, EQUITY_UNIVERSE } from "./equity-universe.js";\nexport { CATEGORY_COUNTS, CATEGORY_ORDER, FLAG_DEFINITIONS, UNIVERSE_SIZE } from "./shared-config.js";\nexport { EQUITY_REFERENCE_AS_OF, EQUITY_REFERENCE_SOURCE } from "./equity-universe.js";',
              'import { EQUITY_REFERENCE_AS_OF, EQUITY_REFERENCE_SOURCE, EQUITY_UNIVERSE } from "./equity-universe.js";\nimport { ETF_REFERENCE_AS_OF, ETF_REFERENCE_SOURCES, ETF_UNIVERSE } from "./etf-universe.js";\nexport { CATEGORY_COUNTS, CATEGORY_ORDER, FLAG_DEFINITIONS, UNIVERSE_SIZE } from "./shared-config.js";\nexport { EQUITY_REFERENCE_AS_OF, EQUITY_REFERENCE_SOURCE } from "./equity-universe.js";\nexport { ETF_REFERENCE_AS_OF, ETF_REFERENCE_SOURCES } from "./etf-universe.js";',
              'catalog ETF import')
          text = replace_once(text,
              'const curatedByCategory = new Map(CATEGORY_ORDER.slice(1).map((category) => [category, CURATED.filter((item) => item.category === category)]));\nconst equityReferenceIndexByTicker = new Map(EQUITY_UNIVERSE.map(([ticker], index) => [normalizeIdentifier(ticker), index]));',
              'const curatedByCategory = new Map(CATEGORY_ORDER.slice(1).map((category) => [category, CURATED.filter((item) => item.category === category)]));\nconst curatedEtfTickers = new Set(curatedByCategory.get("ETFs").map((item) => item.symbol));\nconst etfReferenceTail = ETF_UNIVERSE.filter(([ticker]) => !curatedEtfTickers.has(ticker));\nif (etfReferenceTail.length !== CATEGORY_COUNTS.ETFs - curatedEtfTickers.size) throw new Error("ETF reference universe must exactly cover the configured ETF shelf");\nconst equityReferenceIndexByTicker = new Map(EQUITY_UNIVERSE.map(([ticker], index) => [normalizeIdentifier(ticker), index]));',
              'ETF reference tail')
          text = replace_once(text,
              'for (const [ticker, name, exchange] of EQUITY_UNIVERSE) {\n  for (const value of [ticker, name, exchange]) normalizeSearchText(value).split(" ").filter(Boolean).forEach((word) => SYNTHETIC_SEARCH_WORDS.get("Equities").add(word));\n}',
              'for (const [ticker, name, exchange] of EQUITY_UNIVERSE) {\n  for (const value of [ticker, name, exchange]) normalizeSearchText(value).split(" ").filter(Boolean).forEach((word) => SYNTHETIC_SEARCH_WORDS.get("Equities").add(word));\n}\nfor (const [ticker, name, exchange, issuer] of ETF_UNIVERSE) {\n  for (const value of [ticker, name, exchange, issuer]) normalizeSearchText(value).split(" ").filter(Boolean).forEach((word) => SYNTHETIC_SEARCH_WORDS.get("ETFs").add(word));\n}',
              'ETF search words')
          old = '''  const equityReference = category === "Equities" ? EQUITY_UNIVERSE[index] : null;\n  const [referenceTicker, referenceName, referenceExchange, referenceCik] = equityReference || [];\n  const longTailEquityIndex = Math.max(0, index - EQUITY_UNIVERSE.length);\n  const type = equityReference ? referencedEquityType(referenceName, referenceTicker) : pick(pool.types, seed, 1);\n  let name = equityReference ? referenceName : category === "Equities" ? illustrativeEquityName(longTailEquityIndex) : pick(pool.names, seed, 2);'''
          new = '''  const equityReference = category === "Equities" ? EQUITY_UNIVERSE[index] : null;\n  const etfReference = category === "ETFs" ? etfReferenceTail[index] : null;\n  const [referenceTicker, referenceName, referenceExchange, referenceCik] = equityReference || [];\n  const [etfTicker, etfName, etfExchange, etfIssuer] = etfReference || [];\n  const longTailEquityIndex = Math.max(0, index - EQUITY_UNIVERSE.length);\n  const type = equityReference ? referencedEquityType(referenceName, referenceTicker) : etfReference ? (/\\bETN\\b/i.test(etfName) ? "ETP" : /\\bactive\\b/i.test(etfName) ? "Active ETF" : "ETF") : pick(pool.types, seed, 1);\n  let name = equityReference ? referenceName : etfReference ? etfName : category === "Equities" ? illustrativeEquityName(longTailEquityIndex) : pick(pool.names, seed, 2);'''
          text = replace_once(text, old, new, 'ETF identity')
          text = replace_once(text,
              '  } else if (category !== "Equities") {\n    name = `${name} ${String.fromCharCode(65 + (seed % 18))}`;\n  }',
              '  } else if (category !== "Equities" && !etfReference) {\n    name = `${name} ${String.fromCharCode(65 + (seed % 18))}`;\n  }',
              'ETF name suffix')
          text = replace_once(text,
              '  const symbol = referenceTicker || generatedSymbol;\n  const id = equityReference ? `eq-sec-${index}` : `syn-${slugCategory(category)}-${index}`;\n  const manager = equityReference ? `Public equity · ${referenceExchange}` : pick(pool.managers, seed, 8);\n  let assetClass = equityReference ? (referenceExchange === "OTC" ? "OTC Equity" : "Exchange-Listed Equity") : pick(pool.assets, seed, 9);',
              '  const symbol = referenceTicker || etfTicker || generatedSymbol;\n  const id = equityReference ? `eq-sec-${index}` : etfReference ? `etf-listed-${index}` : `syn-${slugCategory(category)}-${index}`;\n  const manager = equityReference ? `Public equity · ${referenceExchange}` : etfReference ? etfIssuer : pick(pool.managers, seed, 8);\n  let assetClass = equityReference ? (referenceExchange === "OTC" ? "OTC Equity" : "Exchange-Listed Equity") : pick(pool.assets, seed, 9);',
              'ETF symbol and issuer')
          text = replace_once(text,
              '    description: equityReference\n      ? `${referenceName} is included in the prototype public-equity universe using SEC issuer, ticker and exchange reference data. Market, performance, research and product-control fields remain illustrative.`\n      : `Illustrative ${objective.toLowerCase()} solution in ${assetClass.toLowerCase()}, managed by ${manager}. Designed to demonstrate realistic shelf data and governed product metadata.`,',
              '    description: equityReference\n      ? `${referenceName} is included in the prototype public-equity universe using SEC issuer, ticker and exchange reference data. Market, performance, research and product-control fields remain illustrative.`\n      : etfReference\n        ? `${etfName} is included in the prototype ETF universe using current Nasdaq Trader ticker, fund-name and listing-exchange reference data. Classification, market, performance, fee, AUM, research and product-control fields remain illustrative.`\n        : `Illustrative ${objective.toLowerCase()} solution in ${assetClass.toLowerCase()}, managed by ${manager}. Designed to demonstrate realistic shelf data and governed product metadata.`,',
              'ETF reference description')
          text = replace_once(text,
              '    identifier: equityReference ? String(referenceCik).padStart(10, "0") : `${symbolPrefix}${String(seed).slice(0, 8)}`,\n    referenceSource: equityReference ? EQUITY_REFERENCE_SOURCE : null,\n    referenceAsOf: equityReference ? EQUITY_REFERENCE_AS_OF : null,',
              '    identifier: equityReference ? String(referenceCik).padStart(10, "0") : etfReference ? etfTicker : `${symbolPrefix}${String(seed).slice(0, 8)}`,\n    referenceSource: equityReference ? EQUITY_REFERENCE_SOURCE : etfReference ? ETF_REFERENCE_SOURCES.join(" · ") : null,\n    referenceAsOf: equityReference ? EQUITY_REFERENCE_AS_OF : etfReference ? ETF_REFERENCE_AS_OF : null,\n    primaryMarket: etfReference ? etfExchange : undefined,',
              'ETF reference metadata')
          path.write_text(text)

          path = Path('package.json')
          text = path.read_text()
          text = replace_once(text, 'node --check lib/equity-universe.js && node --check lib/catalog.js', 'node --check lib/equity-universe.js && node --check lib/etf-universe.js && node --check lib/catalog.js', 'package ETF module check')
          text = replace_once(text, 'node --check scripts/build-static.mjs && node --check scripts/refresh-equity-universe.mjs",', 'node --check scripts/build-static.mjs && node --check scripts/refresh-equity-universe.mjs && node --check scripts/refresh-etf-universe.mjs",', 'package ETF refresh check')
          text = replace_once(text, '    "refresh:equities": "node scripts/refresh-equity-universe.mjs",', '    "refresh:equities": "node scripts/refresh-equity-universe.mjs",\n    "refresh:etfs": "node scripts/refresh-etf-universe.mjs",', 'package ETF refresh script')
          path.write_text(text)

          path = Path('tests/search.test.mjs')
          text = path.read_text()
          text = replace_once(text,
              'import { CATEGORY_ORDER, EQUITY_REFERENCE_AS_OF, EQUITY_REFERENCE_SOURCE, FLAG_DEFINITIONS, getInvestmentDetail, getMarketSnapshots, getSearchIndex, searchCatalog, UNIVERSE_SIZE } from "../lib/catalog.js";\nimport { EQUITY_UNIVERSE } from "../lib/equity-universe.js";',
              'import { CATEGORY_ORDER, EQUITY_REFERENCE_AS_OF, EQUITY_REFERENCE_SOURCE, ETF_REFERENCE_AS_OF, ETF_REFERENCE_SOURCES, FLAG_DEFINITIONS, getInvestmentDetail, getMarketSnapshots, getSearchIndex, searchCatalog, UNIVERSE_SIZE } from "../lib/catalog.js";\nimport { EQUITY_UNIVERSE } from "../lib/equity-universe.js";\nimport { ETF_UNIVERSE } from "../lib/etf-universe.js";',
              'ETF test imports')
          insertion = '''\n\ntest("the ETF shelf uses 1,117 current real listed identities", () => {\n  assert.equal(ETF_UNIVERSE.length, 1117);\n  assert.match(ETF_REFERENCE_AS_OF, /^\\d{4}-\\d{2}-\\d{2}$/);\n  assert.equal(ETF_REFERENCE_SOURCES.length, 2);\n  assert.ok(ETF_REFERENCE_SOURCES.every((url) => /^https:\\/\\/www\\.nasdaqtrader\\.com\\//.test(url)));\n  const etfs = getSearchIndex("ETFs");\n  assert.equal(etfs.length, 1117);\n  assert.equal(new Set(etfs.map((item) => item.symbol)).size, 1117);\n  assert.ok(new Set(etfs.map((item) => item.name)).size >= 1100);\n  assert.ok(etfs.every((item) => !/^(?:US Quality Leaders|Short Treasury|Global Infrastructure|Tax-Aware Municipal) ETF [A-R]$/i.test(item.name)));\n  assert.ok(etfs.every((item) => !/^ET\\d{4}$/i.test(item.symbol)));\n  for (const ticker of ["SPY", "VOO", "VTI", "QQQ", "JEPI", "AVUV"]) {\n    const row = etfs.find((item) => item.symbol === ticker);\n    assert.ok(row, `missing current ETF ${ticker}`);\n    assert.ok(row.name.length > ticker.length);\n    assert.ok(row.manager);\n    const result = searchCatalog({ q: ticker, category: "ETFs" });\n    assert.equal(result.items[0]?.symbol, ticker, `ticker search failed for ${ticker}`);\n  }\n});\n'''
          anchor = '\n\ntest("SEC-referenced equities support ticker, issuer-name, profile and snapshot flows", () => {'
          if anchor not in text:
              raise SystemExit('ETF test insertion anchor missing')
          text = text.replace(anchor, insertion + anchor, 1)
          text = replace_once(text,
              '  const result = searchCatalog({ q: "Vest" });\n  assert.ok(result.total > 0);\n  assert.ok(result.items.every((item) => /\\bvest/i.test(`${item.name} ${item.manager}`)));\n  assert.ok(result.items.some((item) => item.manager === "Cboe Vest"));\n  assert.ok(result.items.every((item) => item.manager !== "Parnassus Investments"));',
              '  const result = searchCatalog({ q: "Vest", category: "Managed Options" });\n  assert.ok(result.total > 0);\n  assert.ok(result.items.every((item) => /\\bvest/i.test(`${item.name} ${item.manager}`)));\n  assert.ok(result.items.some((item) => item.manager === "Cboe Vest"));\n  assert.ok(result.items.every((item) => item.manager !== "Parnassus Investments"));',
              'Vest search scope')
          path.write_text(text)
          PY
      - name: Verify core ETF identities before full build
        run: |
          node --input-type=module - <<'JS'
          import { ETF_UNIVERSE } from './lib/etf-universe.js';
          import { getSearchIndex, searchCatalog } from './lib/catalog.js';
          const index = getSearchIndex('ETFs');
          for (const ticker of ['SPY', 'VOO', 'VTI', 'QQQ', 'JEPI', 'AVUV']) {
            console.log(ticker, ETF_UNIVERSE.find((row) => row[0] === ticker), index.find((row) => row.symbol === ticker)?.name, searchCatalog({ q: ticker, category: 'ETFs' }).items[0]?.symbol);
          }
          JS
      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Commit generated ETF universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/etf-universe.js lib/catalog.js package.json tests/search.test.mjs scripts/refresh-etf-universe.mjs
          git commit -m "Use real listed ETF identities across screener" || exit 0
          git push origin HEAD:data/real-etf-universe
