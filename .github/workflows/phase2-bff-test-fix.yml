name: Align Phase Two BFF Test

on:
  push:
    branches: [phase2/my-book]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2/my-book
          fetch-depth: 0
      - name: Update BFF contract test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/wealth.test.mjs')
          text = path.read_text()
          text = text.replace('import { getWealthProjection, parseHouseholdId, parseProjectionView } from "../api/wealth.js";', 'import { getWealthProjection, parseAdvisorId, parseHouseholdId, parseProjectionView } from "../api/wealth.js";')
          old = '''test("wealth BFF exposes bounded projection views and rejects invalid identifiers", () => {\n  assert.equal(parseHouseholdId(DEFAULT_HOUSEHOLD_ID), DEFAULT_HOUSEHOLD_ID);\n  assert.equal(parseProjectionView(null), "overview");\n  assert.throws(() => parseHouseholdId("../all-households"), /Invalid householdId/);\n  assert.throws(() => parseProjectionView("everything"), /Invalid view/);\n  assert.equal(getWealthProjection("missing-household", "overview"), null);\n  assert.deepEqual(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "overview"), defaultOverview);\n  assert.deepEqual(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "history"), WEALTH_HISTORY);\n  assert.deepEqual(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "concentration"), CONCENTRATION_REVIEW);\n  assert.deepEqual(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "account", "joint-brokerage"), HOUSEHOLD_ACCOUNTS[0]);\n  assert.deepEqual(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "goal", "retirement-income"), HOUSEHOLD_GOALS[0]);\n});'''
          new = '''test("wealth BFF exposes bounded book and household projections and rejects invalid identifiers", () => {\n  assert.equal(parseAdvisorId("advisor-042"), "advisor-042");\n  assert.equal(parseHouseholdId(DEFAULT_HOUSEHOLD_ID), DEFAULT_HOUSEHOLD_ID);\n  assert.equal(parseProjectionView(null), "overview");\n  assert.throws(() => parseHouseholdId("../all-households"), /Invalid householdId/);\n  assert.throws(() => parseAdvisorId("../all-advisors"), /Invalid advisorId/);\n  assert.throws(() => parseProjectionView("everything"), /Invalid view/);\n  assert.equal(getWealthProjection("missing-household", "overview"), null);\n\n  const book = getWealthProjection("advisor-042", "book", "", { pageSize: 7 });\n  assert.equal(book.metrics.householdCount, 128);\n  assert.equal(book.items.length, 7);\n  assert.equal(book.nextCursor, 7);\n  assert.ok(book.items.every((item) => !('accounts' in item) && !('holdings' in item)));\n\n  const morrison = getWealthProjection(DEFAULT_HOUSEHOLD_ID, "overview");\n  assert.equal(morrison.household.name, "Morrison Household");\n  assert.equal(morrison.household.netWorth, 12420000);\n  assert.equal(morrison.household.financialAssets, 11980000);\n  assert.equal(morrison.household.investableCash, 740000);\n  assert.equal(morrison.household.accountCount, 6);\n  assert.equal(morrison.household.hasConcentrationPolicy, true);\n  assert.deepEqual(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "history"), WEALTH_HISTORY);\n  assert.equal(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "concentration").holding.symbol, "AAPL");\n  assert.equal(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "account", "joint-brokerage").value, HOUSEHOLD_ACCOUNTS[0].value);\n  assert.equal(getWealthProjection(DEFAULT_HOUSEHOLD_ID, "goal", "retirement-income").progress, HOUSEHOLD_GOALS[0].progress);\n});'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected old BFF test exactly once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/phase2-bff-test-fix.yml
      - name: Commit BFF test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate advisor book BFF contract"
          git push origin HEAD:phase2/my-book
