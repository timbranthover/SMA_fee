name: Update lazy slider assertion

on:
  push:
    branches: [perf/wealth-lazy-projections]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/wealth-lazy-projections
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update static assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'tests/static.test.mjs';
          let source = await readFile(path, 'utf8');
          const before = '  assert.match(app, /import noUiSlider from "\\/vendor\\/nouislider\\.mjs"/);';
          const after = '  assert.match(app, /import\\("\\/vendor\\/nouislider\\.mjs"\\)/);\n  assert.doesNotMatch(app, /import noUiSlider from/);';
          if (!source.includes(before)) throw new Error('Expected eager slider assertion not found');
          source = source.replace(before, after);
          await writeFile(path, source);
          NODE
      - name: Commit test update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/static.test.mjs
          git commit -m "Require lazy slider loading"
          git push
