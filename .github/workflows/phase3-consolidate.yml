name: Phase Three Polish

on:
  push:
    branches: [phase3/consolidated]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/consolidated
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Remove false tax precision
        run: python scripts/phase3-polish.py
      - run: npm ci
      - name: Run full build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/phase3-polish-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "--- FAILURE SUMMARY ---"
            grep -nE "not ok|AssertionError|ERR_|error:|Error:|fail [1-9]|operator:" /tmp/phase3-polish-build.log | tail -n 100 || true
          fi
          exit "$status"
      - name: Commit validated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/decision.js app.js lib/decision-service.js tests/decision.test.mjs
          git diff --cached --quiet && { echo "No polish changes to commit"; exit 1; }
          git commit -m "Keep decision scenarios evidence-based"
          git push origin HEAD:phase3/consolidated
