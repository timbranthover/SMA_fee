name: Apply wealth performance refactor

on:
  push:
    branches: [perf/wealth-lazy-projections]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/wealth-lazy-projections
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Align performance assertion with generic household loader
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'tests/wealth.test.mjs';
          let source = await readFile(path, 'utf8');
          const before = '  assert.match(browserWealth, /view: "overview"/);';
          const after = '  assert.match(browserWealth, /loadHouseholdOverview/);';
          if (source.includes(before)) source = source.replace(before, after);
          await writeFile(path, source);
          NODE
      - name: Commit assertion update
        run: |
          if git diff --quiet -- tests/wealth.test.mjs; then
            echo "No test changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/wealth.test.mjs
          git commit -m "Align wealth performance assertion"
          git push
