name: Apply wealth performance refactor

on:
  push:
    branches: [perf/wealth-lazy-projections]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/wealth-lazy-projections
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-wealth-perf-refactor.mjs
      - name: Commit app refactor
        run: |
          if git diff --quiet -- app.js; then
            echo "No app changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Lazy load wealth detail and screener work"
          git push
