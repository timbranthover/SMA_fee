name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply guarded market-row upgrade
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/market-row-sizing'
        run: node scripts/apply-market-row-sizing.mjs
      - name: Inspect size sort output
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/market-row-sizing'
        run: node scripts/debug-market-size.mjs
      - run: npm run build
      - name: Commit verified upgrade
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/market-row-sizing'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css lib/market-data.js lib/catalog.js lib/column-config.js lib/sort-config.js tests/market-data.test.mjs tests/columns.test.mjs tests/search.test.mjs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Refine live market rows and add size sorting"
            git push origin HEAD:feat/market-row-sizing
          fi
