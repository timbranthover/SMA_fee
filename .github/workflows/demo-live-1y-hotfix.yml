name: Demo-safe live 1Y sort hotfix
on:
  push:
    branches:
      - hotfix/demo-live-1y-sort-20260902
    paths:
      - scripts/apply-demo-live-1y-hotfix.mjs
      - .github/workflows/demo-live-1y-hotfix.yml
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-demo-live-1y-hotfix.mjs
      - run: npm run build
      - name: Commit validated hotfix
        run: |
          rm scripts/apply-demo-live-1y-hotfix.mjs .github/workflows/demo-live-1y-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/search.js lib/market-data.js scripts/apply-demo-live-1y-hotfix.mjs .github/workflows/demo-live-1y-hotfix.yml
          git commit -m "Make live 1Y sorting demo-safe"
          git push origin HEAD:hotfix/demo-live-1y-sort-20260902